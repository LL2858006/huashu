食痛点：重油重盐/外卖饮食习惯不佳；孩子挑食、营养跟不上，家长想让孩子赢在起跑线\n\n\t4.\t排便痛点：肠胃不畅、三四天只进不出，身体“交通拥堵”\n\n\t5.\t冬季护肤痛点：天气干燥，手脚干裂、皮肤缺水\n\n\t6.\t选油痛点：市面山茶油鱼龙混杂，有调和油、低树龄、工艺差的产品，难买到纯山茶油\n\n核心卖点\n\n产品本身优势\n\n\t1.\t烟点超高：260℃高烟点，高温爆炒几乎无油烟，煎鱼不糊、炒菜不呛眼不咳，适配中式烹饪，凉拌/生吃/生喝均可\n\n\t2.\t营养丰富：含80%+高油酸（比橄榄油高10%，被称东方橄榄油）；维生素E是橄榄油2倍，含角鲨烯、茶多酚等100+活性抗氧化物质；锌是大豆油10倍，含钙铁锌硒+膳食纤维，满足全家营养\n\n\t3.\t历史溯源：传承3000年，《山海经》《本草纲目》有记载，古代为御膳用油，百岁老人常年食用，食补价值有依据\n\n品质与产地优势\n\n\t1.\t黄金产地：湖北钟祥大洪山（长寿之乡），富硒土壤，方圆5公里无污染，山茶树不打药不施肥\n\n\t2.\t稀缺原料：30年以上老树果榨油，树龄越长营养越足，1瓶抵普通山茶油五六瓶，市面难买、往年不直播售卖\n\n\t3.\t硬核工艺：传统物理熟榨，非冷榨，保留原始营养，0添加0勾兑0反式脂肪酸，无黄曲霉素、无重金属\n\n\t4.\t纯正无掺假：配料表仅“山茶籽”，99+1纯山茶油，执行国标GB/T11765，有国家检测报告，支持第三方检测\n\n食用与使用优势\n\n\t1.\t全家适配：男女老少皆宜，可做宝宝油、月子油，空腹直饮、烹饪、外用均可\n\n\t2.\t外用护肤：分子小易吸收，清爽不黏腻，擦手擦脸保养头发，缓解冬季手脚干裂，有淡淡木质香\n\n\t3.\t包装安全：PET食品级包装，避免玻璃瓶重金属溶解，食品安全有保障\n\n福利与售后优势\n\n\t1.\t价格福利：源头发货无中间商，268元到手5瓶30年老树山茶油，市面普通款本地单瓶近200元\n\n\t2.\t试吃保障：支持正装试吃，任意开一瓶体验，不满意可退\n\n\t3.\t售后无忧：赠运费险，七天无理由，未拆封/已试吃均可退，268元全额退款，无后顾之忧\n\n\t4.\t发货保障：最新生产日期，保质期18个月，现货现发，邮政快递，省内2天、省外3-5天到货\n\n工艺与采摘优势\n\n\t1.\t人工采摘：纯手工一颗颗挑选茶果，剔除坏果烂果，保证原料品质，区别于机器批量采摘的劣质原料\n\n\t2.\t出油率低：油茶树5-8年结果、15年丰果期，一亩仅出40-50斤油，100斤茶籽仅出20斤油，稀缺性高，被称“液体黄金”","w":1174},{"t":"人设 你开服装店的 开了10年","c":"服装","b":"人设 你开服装店的 开了10年\n开场福利话术 人设➕福利\n欢迎姐妹们！我是开了10年服装店的老板娘！有没有姐妹想找一件暖和又百搭的打底，这是我们店里的大爆款！可以看看一号链接，马上过年了，我准备清掉库存回家了（圈人群）\n\n塑品\n姐妹们，马上过年，过年穿的打底买好了吗，因为我开服装店很多年了，我知道打底没选好，再好再贵的外套搭配起来都不好看（人群痛点）\n一号链接很合适，大家可以拿回家试一下\n双面给大家做的是，双面澳绒加绒的，穿在身上很舒服，可以贴身穿，穿久出汗身上不会痒（展示他的柔软）\n进货的时候，我们专门给姐妹们挑选了\n这种堆堆领，不会勒脖子，脖子短 脖子长的姐妹都能穿，穿在身上都好看\n80斤到180斤都能穿，贴身穿软乎乎的，一点不扎。6个尺码，7个颜色推荐米白（那个卖的好 推荐那个）\n大码小码都有 姐妹们 赶紧把身高体重打出来 我给你推荐尺码\n\n逼单\n姐妹们，我店里没有多少库存了，马上就要断色断码了，所以大家赶紧去拍，今天拍还有运费险，您可以拿回去试一下，你觉得好就留，不好直接退回来都可以的，现在拍我12点就给你，发到仓库，大概下午就能发出去\n\n痛点\n姐妹们，像这种打底衣，你们有没有卖到那种，穿了没有多久就起球的 变形的，\n穿在身上显得非常廉价\n您把我们家这个衣服去试穿一下，虽然他价格不贵呀，但是他的质量确实好，因为今天清仓，双面澳绒的材质，做了抗起球的工艺，所以质量非常好，所以不管怎么刷他，揉搓他，都不变形不起球\n（买个刷子在直播间展示）\n\n逼单\n我看后台库存不多，还有最后三单（根据直播间的人数判断）七天无理由 运险险都有 排单发货 早拍早发货 \n\n\n\n\nM到XXXL码，搭大衣、羽绒服都好看。\n\n\t•\t品质保障：不起球、不掉毛，我店里老顾客都是两三件地回购！\n\n【逼单·给利】\n\n我店里平时卖99一件，今天直播间直接给你们炸福利！\n\n\t•
