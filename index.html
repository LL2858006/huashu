function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filtered(){const k=q.trim().toLowerCase();return DATA.filter(x=>(cur==="全部"||x.c===cur)&&(!k||(x.t+" "+x.b).toLowerCase().includes(k)))}
function renderCats(){$("#cats").innerHTML=CATS.map(c=>'<button data-c="'+esc(c)+'" class="'+(c===cur?"active":"")+'">'+esc(c)+'</button>').join("")}
function render(){const all=filtered(),rows=all.slice(0,shown);
 $("#list").innerHTML=rows.length?rows.map((x,i)=>'<article class="card"><h2>'+esc(x.t)+'</h2><div class="meta"><span class="c">'+esc(x.c)+'</span><span>'+x.w+' 字</span></div><div class="body" id="b'+i+'">'+esc(x.b)+'</div><div class="acts"><button class="more" data-i="'+i+'">展开全文</button><button class="copy" data-copy="'+i+'">复制话术</button></div></article>').join(""):'<div class="empty">没有找到相关话术</div>';
 $("#more").innerHTML=all.length>shown?'<button class="more" id="loadMore" style="border:0;border-radius:10px;padding:11px 22px;font-weight:700">加载更多（还有 '+(all.length-shown)+' 篇）</button>':"";
 window.__rows=rows}
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-c]");if(c){cur=c.dataset.c;shown=20;renderCats();render();window.scrollTo({top:0,behavior:"smooth"});return}
 const m=e.target.closest("[data-i]");if(m){const b=document.getElementById("b"+m.dataset.i);b.classList.toggle("open");m.textContent=b.classList.contains("open")?"收起":"展开全文";return}
 const cp=e.target.closest("[data-copy]");if(cp){const x=window.__rows[+cp.dataset.copy];const txt=x.t+"\n\n"+x.b;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast("已复制，去粘贴吧")).catch(()=>fallback(txt))}else fallback(txt);return}
 if(e.target.id==="loadMore"){shown+=20;render()}
});
function fallback(txt){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已复制，去粘贴吧")}catch(err){toast("复制失败，请长按选择")}document.body.removeChild(ta)}
$("#q").addEventListener("input",e=>{q=e.target.value;shown=20;render()});
renderCats();render();
</script></body></html>
